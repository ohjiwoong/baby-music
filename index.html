<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d24">
<title>아이 노래 버튼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #1b1d24;
    --card: #2a2d38;
    --text: #f4f4f6;
    --muted: #9a9cab;
    --accent: #ffcc33;
    --danger: #ff5c5c;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* 상단: 플레이어 + 컨트롤 */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; background: #13151a;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .player-box {
    width: 200px; height: 200px; flex: none;
    border-radius: 12px; overflow: hidden; background: #000;
  }
  .player-box iframe { width: 100%; height: 100%; display: block; }
  .now { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .now-title {
    font-size: 20px; font-weight: 700; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .now-title.empty { color: var(--muted); font-weight: 500; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .ctl {
    border: 0; border-radius: 14px; background: var(--card); color: var(--text);
    font-size: 18px; font-weight: 700; padding: 14px 16px; min-width: 64px;
  }
  .ctl:active { transform: scale(0.96); }
  .ctl.on { background: var(--accent); color: #222; }

  /* 노래 버튼 격자 */
  main { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .song {
    position: relative; border: 0; padding: 0; text-align: left;
    background: var(--card); color: var(--text); border-radius: var(--radius);
    overflow: hidden; outline: 4px solid transparent; transition: outline-color .15s;
  }
  .song:active { transform: scale(0.97); }
  .song.playing { outline-color: var(--accent); }
  .song img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .song .name { padding: 10px 12px 12px; font-size: 18px; font-weight: 700; line-height: 1.25; }
  .song.playing .name::before { content: "▶ "; color: var(--accent); }

  .empty-hint { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 17px; line-height: 1.6; }

  /* 편집 모드 */
  .edit-bar { display: none; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  body.editing .edit-bar { display: flex; }
  .edit-bar input {
    flex: 1 1 240px; min-width: 0; font-size: 16px; padding: 12px; border-radius: 12px;
    border: 2px solid #444; background: #111; color: var(--text); user-select: text; -webkit-user-select: text;
  }
  .edit-bar button, .song-tools button {
    border: 0; border-radius: 12px; background: #3a3e4c; color: var(--text);
    font-size: 15px; font-weight: 600; padding: 12px 14px;
  }
  .edit-bar .primary { background: var(--accent); color: #222; }
  .song-tools { display: none; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
  body.editing .song-tools { display: flex; }
  .song-tools .del { background: var(--danger); }
  body.editing .song { outline: 2px dashed #555; }

  /* 유튜브 뮤직 앱 모드: 이 화면의 플레이어와 재생 컨트롤은 필요 없음 */
  body.app-mode .player-box,
  body.app-mode #pauseBtn,
  body.app-mode #repeatBtn { display: none; }

  .edit-btn { margin-left: auto; position: relative; overflow: hidden; }
  .edit-btn .fill {
    position: absolute; inset: 0; background: rgba(255,204,51,.35);
    transform: scaleX(0); transform-origin: left;
  }
  .edit-btn.holding .fill { transition: transform .8s linear; transform: scaleX(1); }
  .edit-btn span { position: relative; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: #000c; color: #fff; padding: 14px 20px; border-radius: 14px; font-size: 16px;
    transition: transform .25s; max-width: 90vw; text-align: center; z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 세로 좁은 화면: 플레이어는 유튜브 최소 크기(200x200)로 왼쪽 구석에 */
  @media (max-width: 520px) {
    header { align-items: flex-start; gap: 10px; }
    .now { gap: 8px; }
    .now-title { font-size: 15px; }
    .controls { gap: 8px; }
    .ctl { font-size: 16px; padding: 12px; min-width: 56px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .song .name { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="player-box"><div id="player"></div></div>
    <div class="now">
      <div class="now-title empty" id="nowTitle">노래 버튼을 눌러주세요</div>
      <div class="controls">
        <button class="ctl" id="pauseBtn">⏸</button>
        <button class="ctl" id="repeatBtn">🔂 한곡반복</button>
        <button class="ctl edit-btn" id="editBtn"><div class="fill"></div><span>✏️</span></button>
      </div>
    </div>
  </header>
  <main>
    <div class="edit-bar">
      <input id="urlInput" type="url" inputmode="url" placeholder="유튜브 링크 붙여넣기">
      <button class="primary" id="addBtn">추가</button>
      <button id="exportBtn">내보내기</button>
      <button id="importBtn">가져오기</button>
      <button id="modeBtn"></button>
      <button id="doneBtn">편집 끝</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty-hint" id="emptyHint" hidden>
      아직 노래가 없어요.<br>
      위의 ✏️ 버튼을 <b>길게 눌러</b> 편집 모드로 들어간 뒤<br>
      유튜브 링크를 붙여넣어 노래를 추가하세요.
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'baby-music.songs';
const REPEAT_KEY = 'baby-music.repeat';
// 반복 모드: one(한곡반복) → all(다음곡) → off(끝나면정지)
const REPEAT_MODES = {
  one: '🔂 한곡반복',
  all: '🔁 다음곡',
  off: '⏹ 한번만',
};

const MODE_KEY = 'baby-music.mode';
// 재생 방식: page(이 화면의 유튜브 플레이어) / app(유튜브 뮤직 앱으로 열기)
const PLAY_MODES = {
  page: '재생: 이 화면',
  app: '재생: 유튜브 뮤직 앱',
};

const $ = (id) => document.getElementById(id);
let songs = load(STORE_KEY, []);
let repeat = load(REPEAT_KEY, 'one');
let mode = load(MODE_KEY, 'page');
let currentId = null;
let player = null;
let playerReady = false;
let pendingId = null;

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(songs)); } catch {}
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ---------- 유튜브 링크 파싱 ----------
function parseVideoId(text) {
  text = text.trim();
  if (/^[\w-]{11}$/.test(text)) return text;
  try {
    const u = new URL(text);
    if (u.hostname === 'youtu.be') return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);
    if (m) return m[1];
  } catch {}
  return null;
}

async function fetchTitle(id) {
  const url = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
  const sources = [
    'https://www.youtube.com/oembed?format=json&url=' + url,
    'https://noembed.com/embed?url=' + url,
  ];
  for (const src of sources) {
    try {
      const r = await fetch(src);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.title) return j.title;
    } catch {}
  }
  return null;
}

// ---------- 화면 그리기 ----------
function render() {
  const grid = $('grid');
  grid.innerHTML = '';
  $('emptyHint').hidden = songs.length > 0;
  songs.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'song' + (s.id === currentId ? ' playing' : '');
    el.innerHTML = `
      <img loading="lazy" alt="">
      <div class="name"></div>
      <div class="song-tools">
        <button data-act="up">◀</button>
        <button data-act="down">▶</button>
        <button data-act="rename">이름</button>
        <button data-act="del" class="del">삭제</button>
      </div>`;
    el.querySelector('img').src = `https://i.ytimg.com/vi/${s.id}/hqdefault.jpg`;
    el.querySelector('.name').textContent = s.title;
    el.addEventListener('click', (e) => {
      const act = e.target.dataset && e.target.dataset.act;
      if (act) return editAction(act, i);
      if (document.body.classList.contains('editing')) return;
      play(s.id);
    });
    grid.appendChild(el);
  });
  $('repeatBtn').textContent = REPEAT_MODES[repeat];
  $('modeBtn').textContent = PLAY_MODES[mode];
  document.body.classList.toggle('app-mode', mode === 'app');
}

function editAction(act, i) {
  if (act === 'up' && i > 0) [songs[i - 1], songs[i]] = [songs[i], songs[i - 1]];
  if (act === 'down' && i < songs.length - 1) [songs[i + 1], songs[i]] = [songs[i], songs[i + 1]];
  if (act === 'rename') {
    const name = prompt('버튼에 보일 이름', songs[i].title);
    if (name && name.trim()) songs[i].title = name.trim();
  }
  if (act === 'del' && confirm(`"${songs[i].title}" 삭제할까요?`)) songs.splice(i, 1);
  save();
  render();
}

// ---------- 재생 ----------
function play(id) {
  currentId = id;
  const s = songs.find((x) => x.id === id);
  $('nowTitle').textContent = s ? s.title : '';
  $('nowTitle').classList.remove('empty');
  $('pauseBtn').textContent = '⏸';
  render();
  if (mode === 'app') return openInMusicApp(id);
  requestWakeLock();
  if (playerReady) player.loadVideoById(id);
  else pendingId = id;
}

function openInMusicApp(id) {
  if (playerReady) player.pauseVideo();
  const web = 'https://music.youtube.com/watch?v=' + id;
  // 안드로이드: intent 링크로 유튜브 뮤직 앱을 직접 열고, 앱이 없으면 웹으로
  location.href = /Android/i.test(navigator.userAgent)
    ? `intent://music.youtube.com/watch?v=${id}#Intent;scheme=https;package=com.google.android.apps.youtube.music;S.browser_fallback_url=${encodeURIComponent(web)};end`
    : web;
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        playerReady = true;
        if (pendingId) { player.loadVideoById(pendingId); pendingId = null; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) $('pauseBtn').textContent = '⏸';
        if (e.data === YT.PlayerState.PAUSED) $('pauseBtn').textContent = '▶';
        if (e.data === YT.PlayerState.ENDED) onEnded();
      },
      onError: (e) => {
        const msg = (e.data === 101 || e.data === 150)
          ? '이 영상은 외부 재생이 막혀 있어요. 다른 영상으로 바꿔주세요.'
          : '재생할 수 없는 영상이에요 (오류 ' + e.data + ')';
        toast(msg);
      },
    },
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function onEnded() {
  if (repeat === 'one') { player.seekTo(0); player.playVideo(); return; }
  if (repeat === 'all' && songs.length) {
    const i = songs.findIndex((s) => s.id === currentId);
    play(songs[(i + 1) % songs.length].id);
    return;
  }
  $('pauseBtn').textContent = '▶';
}

$('pauseBtn').addEventListener('click', () => {
  if (!playerReady || !currentId) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) player.pauseVideo();
  else player.playVideo();
});

$('repeatBtn').addEventListener('click', () => {
  const keys = Object.keys(REPEAT_MODES);
  repeat = keys[(keys.indexOf(repeat) + 1) % keys.length];
  try { localStorage.setItem(REPEAT_KEY, JSON.stringify(repeat)); } catch {}
  render();
  toast(REPEAT_MODES[repeat]);
});

// ---------- 편집 모드 (길게 눌러 진입) ----------
(() => {
  const btn = $('editBtn');
  let timer = null;
  const start = (e) => {
    e.preventDefault();
    if (document.body.classList.contains('editing')) return;
    btn.classList.add('holding');
    timer = setTimeout(() => {
      btn.classList.remove('holding');
      document.body.classList.add('editing');
      if (navigator.vibrate) navigator.vibrate(40);
      toast('편집 모드');
    }, 800);
  };
  const cancel = () => { clearTimeout(timer); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('click', () => {
    if (!document.body.classList.contains('editing')) toast('✏️ 버튼을 길게 누르면 편집할 수 있어요');
  });
})();

$('doneBtn').addEventListener('click', () => document.body.classList.remove('editing'));

$('modeBtn').addEventListener('click', () => {
  mode = mode === 'page' ? 'app' : 'page';
  try { localStorage.setItem(MODE_KEY, JSON.stringify(mode)); } catch {}
  if (mode === 'app' && playerReady) player.pauseVideo();
  render();
  toast(mode === 'app'
    ? '버튼을 누르면 유튜브 뮤직 앱에서 재생돼요. 반복은 앱에서 설정하세요'
    : '이 화면에서 바로 재생해요');
});

$('addBtn').addEventListener('click', async () => {
  const input = $('urlInput');
  const id = parseVideoId(input.value);
  if (!id) return toast('유튜브 링크를 확인해주세요');
  if (songs.some((s) => s.id === id)) return toast('이미 있는 노래예요');
  const btn = $('addBtn');
  btn.disabled = true;
  const title = (await fetchTitle(id)) || prompt('제목을 못 가져왔어요. 버튼 이름을 적어주세요', '') || '노래';
  btn.disabled = false;
  songs.push({ id, title });
  save();
  render();
  input.value = '';
  toast('추가했어요. "이름" 버튼으로 짧게 바꿀 수 있어요');
});
$('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addBtn').click(); });

$('exportBtn').addEventListener('click', async () => {
  const text = JSON.stringify(songs);
  try { await navigator.clipboard.writeText(text); toast('목록을 복사했어요. 메모장 등에 붙여넣어 보관하세요'); }
  catch { prompt('아래 내용을 복사해 보관하세요', text); }
});
$('importBtn').addEventListener('click', () => {
  const text = prompt('내보내기로 복사한 내용을 붙여넣으세요');
  if (!text) return;
  try {
    const list = JSON.parse(text);
    if (!Array.isArray(list) || !list.every((s) => s && /^[\w-]{11}$/.test(s.id))) throw 0;
    songs = list.map((s) => ({ id: s.id, title: String(s.title || '노래') }));
    save();
    render();
    toast(`${songs.length}곡을 불러왔어요`);
  } catch { toast('형식이 올바르지 않아요'); }
});

// ---------- 화면 꺼짐 방지 ----------
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
document.addEventListener('pointerdown', requestWakeLock, { once: true });
requestWakeLock();

// ---------- 시작 ----------
render();
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
