<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d24">
<title>아이 노래 버튼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #1b1d24;
    --card: #2a2d38;
    --text: #f4f4f6;
    --muted: #9a9cab;
    --accent: #ffcc33;
    --danger: #ff5c5c;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  /* 스크롤 스냅: 영상 영역이 다 보이거나, 완전히 올라가 안 보이거나 둘 중 하나로 */
  html { scroll-snap-type: y mandatory; }
  header { scroll-snap-align: start; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  /* 페이지 전체가 스크롤: 노래가 많으면 위의 영상 영역도 함께 올라가 가려짐 */
  .app { min-height: 100%; }

  /* 상단: 플레이어 + 컨트롤 */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; background: #13151a;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .player-box {
    width: 200px; height: 200px; flex: none;
    border-radius: 12px; overflow: hidden; background: #000;
  }
  .player-box iframe { width: 100%; height: 100%; display: block; }
  .now { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .now-title {
    font-size: 20px; font-weight: 700; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .now-title.empty { color: var(--muted); font-weight: 500; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .ctl {
    border: 0; border-radius: 14px; background: var(--card); color: var(--text);
    font-size: 18px; font-weight: 700; padding: 14px 16px; min-width: 64px;
  }
  .ctl:active { transform: scale(0.96); }
  .ctl.on { background: var(--accent); color: #222; }

  /* 노래 버튼 격자 */
  main { scroll-snap-align: start; min-height: 100vh; min-height: 100dvh; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .song {
    position: relative; border: 0; padding: 0; text-align: left;
    background: var(--card); color: var(--text); border-radius: var(--radius);
    overflow: hidden; outline: 4px solid transparent; transition: outline-color .15s;
  }
  .song:active { transform: scale(0.97); }
  .song.playing { outline-color: var(--accent); }
  .song img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .song .name { padding: 10px 12px 12px; font-size: 18px; font-weight: 700; line-height: 1.25; }
  .song.playing .name::before { content: "▶ "; color: var(--accent); }

  /* 재생 중인 버튼 안의 일시정지/반복 버튼 */
  .song-ctl { display: flex; gap: 6px; padding: 0 8px 8px; }
  .song-ctl button {
    flex: 1; border: 0; border-radius: 10px; background: rgba(0,0,0,.4); color: #fff;
    font-size: 16px; font-weight: 700; padding: 10px 4px; white-space: nowrap;
  }
  .song-ctl button:active { transform: scale(0.95); }
  body.editing .song-ctl, body.app-mode .song-ctl { display: none; }

  /* 글자 버튼 보기: 썸네일 없이 내가 정한 이름 + 노래별 고정 색 */
  body.text-view .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  body.text-view .song { background: var(--song-color, var(--card)); }
  body.text-view .song img { display: none; }
  body.text-view .song .name {
    min-height: 84px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 10px 8px; font-size: 19px; word-break: keep-all;
  }

  .empty-hint { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 17px; line-height: 1.6; }

  /* 편집 모드 */
  .edit-bar { display: none; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  body.editing .edit-bar { display: flex; }
  .edit-bar input {
    flex: 1 1 240px; min-width: 0; font-size: 16px; padding: 12px; border-radius: 12px;
    border: 2px solid #444; background: #111; color: var(--text); user-select: text; -webkit-user-select: text;
  }
  .edit-bar button, .song-tools button {
    border: 0; border-radius: 12px; background: #3a3e4c; color: var(--text);
    font-size: 15px; font-weight: 600; padding: 12px 14px;
  }
  .edit-bar .primary { background: var(--accent); color: #222; }
  .song-tools { display: none; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
  body.editing .song-tools { display: flex; }
  .song-tools .del { background: var(--danger); }
  body.editing .song { outline: 2px dashed #555; }

  /* 검색 결과 */
  .results { display: none; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  body.editing .results:not(:empty) { display: flex; }
  .result {
    display: flex; align-items: center; gap: 10px;
    background: #111; border-radius: 12px; padding: 8px;
  }
  .result img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; background: #000; }
  .result .info { flex: 1; min-width: 0; }
  .result .t {
    font-size: 15px; font-weight: 600; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .result .c { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .result button {
    flex: none; border: 0; border-radius: 10px; background: var(--accent); color: #222;
    font-size: 15px; font-weight: 700; padding: 12px 14px;
  }
  .result button:disabled { background: #3a3e4c; color: var(--muted); }
  .version { text-align: center; color: #555a6a; font-size: 13px; padding: 24px 0 8px; }
  .results .close { align-self: center; border: 0; background: none; color: var(--muted); font-size: 15px; padding: 8px; }

  /* 유튜브 뮤직 앱 모드: 이 화면의 플레이어와 재생 컨트롤은 필요 없음 */
  body.app-mode .player-box,
  body.app-mode #pauseBtn,
  body.app-mode #repeatBtn { display: none; }

  .edit-btn { margin-left: auto; position: relative; overflow: hidden; }
  .edit-btn .fill {
    position: absolute; inset: 0; background: rgba(255,204,51,.35);
    transform: scaleX(0); transform-origin: left;
  }
  .edit-btn.holding .fill { transition: transform .8s linear; transform: scaleX(1); }
  .edit-btn span { position: relative; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: #000c; color: #fff; padding: 14px 20px; border-radius: 14px; font-size: 16px;
    transition: transform .25s; max-width: 90vw; text-align: center; z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 세로 좁은 화면: 플레이어는 유튜브 최소 크기(200x200)로 왼쪽 구석에 */
  @media (max-width: 520px) {
    header { align-items: flex-start; gap: 10px; }
    .now { gap: 8px; }
    .now-title { font-size: 15px; }
    .controls { gap: 8px; }
    .ctl { font-size: 16px; padding: 12px; min-width: 56px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .song .name { font-size: 16px; }
    body.text-view .grid { grid-template-columns: repeat(3, 1fr); }
    body.text-view .song .name { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="player-box"><div id="player"></div></div>
    <div class="now">
      <div class="now-title empty" id="nowTitle">노래 버튼을 눌러주세요</div>
      <div class="controls">
        <button class="ctl" id="pauseBtn">⏸</button>
        <button class="ctl" id="repeatBtn">🔂 한곡반복</button>
        <button class="ctl edit-btn" id="editBtn"><div class="fill"></div><span>✏️</span></button>
      </div>
    </div>
  </header>
  <main>
    <div class="edit-bar">
      <input id="urlInput" type="search" enterkeyhint="search" placeholder="노래 검색 (링크도 가능)">
      <button class="primary" id="addBtn">검색</button>
      <button id="exportBtn">내보내기</button>
      <button id="importBtn">가져오기</button>
      <button id="modeBtn"></button>
      <button id="viewBtn"></button>
      <button id="updateBtn">앱 업데이트</button>
      <button id="doneBtn">편집 끝</button>
    </div>
    <div class="results" id="results"></div>
    <div class="grid" id="grid"></div>
    <div class="empty-hint" id="emptyHint" hidden>
      아직 노래가 없어요.<br>
      위의 ✏️ 버튼을 <b>길게 눌러</b> 편집 모드로 들어간 뒤<br>
      노래를 검색해서 추가하세요.
    </div>
    <div class="version" id="version"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// 배포할 때마다 올림. 폰 화면 맨 아래에 보여서 최신 버전인지 확인용
const APP_VERSION = 'v8';
const STORE_KEY = 'baby-music.songs';
const REPEAT_KEY = 'baby-music.repeat';
// 반복 모드: one(한곡반복) → all(다음곡) → off(끝나면정지)
const REPEAT_MODES = {
  one: '🔂 한곡반복',
  all: '🔁 다음곡',
  off: '⏹ 한번만',
};
const REPEAT_ICONS = { one: '🔂', all: '🔁', off: '⏹' };

const MODE_KEY = 'baby-music.mode';
// 재생 방식: page(이 화면의 유튜브 플레이어) / app(유튜브 뮤직 앱으로 열기)
const PLAY_MODES = {
  page: '재생: 이 화면',
  app: '재생: 유튜브 뮤직 앱',
};

const $ = (id) => document.getElementById(id);
let songs = load(STORE_KEY, []);
let repeat = load(REPEAT_KEY, 'one');
let mode = load(MODE_KEY, 'page');
const VIEW_KEY = 'baby-music.view';
// 보기: thumb(썸네일 2열) / text(글자 3열)
const VIEWS = { thumb: '보기: 썸네일', text: '보기: 글자' };
let view = load(VIEW_KEY, 'thumb');
// 글자 버튼 배경색 (노래 id로 고정)
const SONG_COLORS = ['#3b5bdb', '#2b8a3e', '#c2255c', '#e8590c', '#7048e8', '#0c8599', '#a61e4d', '#5c940d'];
function songColor(id) {
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return SONG_COLORS[h % SONG_COLORS.length];
}
let currentId = null;
let paused = false;
let player = null;
let playerReady = false;
let pendingId = null;

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(songs)); } catch {}
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ---------- 유튜브 링크 파싱 ----------
function parseVideoId(text) {
  text = text.trim();
  if (/^[\w-]{11}$/.test(text)) return text;
  try {
    const u = new URL(text);
    if (u.hostname === 'youtu.be') return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);
    if (m) return m[1];
  } catch {}
  return null;
}

async function fetchTitle(id) {
  const url = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
  const sources = [
    'https://www.youtube.com/oembed?format=json&url=' + url,
    'https://noembed.com/embed?url=' + url,
  ];
  for (const src of sources) {
    try {
      const r = await fetch(src);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.title) return j.title;
    } catch {}
  }
  return null;
}

// ---------- 화면 그리기 ----------
function render() {
  const grid = $('grid');
  grid.innerHTML = '';
  $('emptyHint').hidden = songs.length > 0;
  songs.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'song' + (s.id === currentId ? ' playing' : '');
    el.style.setProperty('--song-color', songColor(s.id));
    el.innerHTML = `
      <img loading="lazy" alt="">
      <div class="name"></div>
      ${s.id === currentId ? `<div class="song-ctl">
        <button data-act="pause">${paused ? '▶' : '⏸'}</button>
        <button data-act="repeat">${REPEAT_ICONS[repeat]}</button>
      </div>` : ''}
      <div class="song-tools">
        <button data-act="up">◀</button>
        <button data-act="down">▶</button>
        <button data-act="rename">이름</button>
        <button data-act="del" class="del">삭제</button>
      </div>`;
    el.querySelector('img').src = `https://i.ytimg.com/vi/${s.id}/hqdefault.jpg`;
    el.querySelector('.name').textContent = s.title;
    el.addEventListener('click', (e) => {
      const act = e.target.dataset && e.target.dataset.act;
      if (act === 'pause') return togglePause();
      if (act === 'repeat') return cycleRepeat();
      if (act) return editAction(act, i);
      if (document.body.classList.contains('editing')) return;
      play(s.id);
    });
    grid.appendChild(el);
  });
  $('repeatBtn').textContent = REPEAT_MODES[repeat];
  $('modeBtn').textContent = PLAY_MODES[mode];
  $('viewBtn').textContent = VIEWS[view];
  document.body.classList.toggle('text-view', view === 'text');
  document.body.classList.toggle('app-mode', mode === 'app');
}

function editAction(act, i) {
  if (act === 'up' && i > 0) [songs[i - 1], songs[i]] = [songs[i], songs[i - 1]];
  if (act === 'down' && i < songs.length - 1) [songs[i + 1], songs[i]] = [songs[i], songs[i + 1]];
  if (act === 'rename') {
    const name = prompt('버튼에 보일 이름', songs[i].title);
    if (name && name.trim()) songs[i].title = name.trim();
  }
  if (act === 'del' && confirm(`"${songs[i].title}" 삭제할까요?`)) songs.splice(i, 1);
  save();
  render();
}

// ---------- 재생 ----------
function play(id, title) {
  currentId = id;
  const s = songs.find((x) => x.id === id);
  $('nowTitle').textContent = s ? s.title : (title || '');
  $('nowTitle').classList.remove('empty');
  paused = false;
  render();
  if (mode === 'app') return openInMusicApp(id);
  requestWakeLock();
  if (playerReady) player.loadVideoById(id);
  else pendingId = id;
}

function openInMusicApp(id) {
  if (playerReady) player.pauseVideo();
  const web = 'https://music.youtube.com/watch?v=' + id;
  // 안드로이드: intent 링크로 유튜브 뮤직 앱을 직접 열고, 앱이 없으면 웹으로
  location.href = /Android/i.test(navigator.userAgent)
    ? `intent://music.youtube.com/watch?v=${id}#Intent;scheme=https;package=com.google.android.apps.youtube.music;S.browser_fallback_url=${encodeURIComponent(web)};end`
    : web;
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        playerReady = true;
        if (pendingId) { player.loadVideoById(pendingId); pendingId = null; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) setPaused(false);
        if (e.data === YT.PlayerState.PAUSED) setPaused(true);
        if (e.data === YT.PlayerState.ENDED) onEnded();
      },
      onError: (e) => {
        const msg = (e.data === 101 || e.data === 150)
          ? '이 영상은 외부 재생이 막혀 있어요. 다른 영상으로 바꿔주세요.'
          : '재생할 수 없는 영상이에요 (오류 ' + e.data + ')';
        toast(msg);
      },
    },
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function onEnded() {
  if (repeat === 'one') { player.seekTo(0); player.playVideo(); return; }
  if (repeat === 'all' && songs.length) {
    const i = songs.findIndex((s) => s.id === currentId);
    play(songs[(i + 1) % songs.length].id);
    return;
  }
  setPaused(true);
}

function setPaused(p) {
  paused = p;
  const label = p ? '▶' : '⏸';
  $('pauseBtn').textContent = label;
  document.querySelectorAll('[data-act="pause"]').forEach((b) => { b.textContent = label; });
}

function togglePause() {
  if (!playerReady || !currentId) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) player.pauseVideo();
  else player.playVideo();
}
$('pauseBtn').addEventListener('click', togglePause);

function cycleRepeat() {
  const keys = Object.keys(REPEAT_MODES);
  repeat = keys[(keys.indexOf(repeat) + 1) % keys.length];
  try { localStorage.setItem(REPEAT_KEY, JSON.stringify(repeat)); } catch {}
  render();
  toast(REPEAT_MODES[repeat]);
}
$('repeatBtn').addEventListener('click', cycleRepeat);

// ---------- 편집 모드 (길게 눌러 진입) ----------
(() => {
  const btn = $('editBtn');
  let timer = null;
  const start = (e) => {
    e.preventDefault();
    if (document.body.classList.contains('editing')) return;
    btn.classList.add('holding');
    timer = setTimeout(() => {
      btn.classList.remove('holding');
      document.body.classList.add('editing');
      if (navigator.vibrate) navigator.vibrate(40);
      toast('편집 모드');
    }, 800);
  };
  const cancel = () => { clearTimeout(timer); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('click', () => {
    if (!document.body.classList.contains('editing')) toast('✏️ 버튼을 길게 누르면 편집할 수 있어요');
  });
})();

// 캐시를 지우고 서버의 최신 파일로 다시 불러오기
$('updateBtn').addEventListener('click', async () => {
  toast('최신 버전을 불러오는 중…');
  try {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.unregister();
  } catch {}
  location.replace(location.pathname + '?v=' + Date.now());
});

$('doneBtn').addEventListener('click', () => {
  document.body.classList.remove('editing');
  $('results').innerHTML = '';
});

$('viewBtn').addEventListener('click', () => {
  view = view === 'thumb' ? 'text' : 'thumb';
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {}
  render();
  if (view === 'text') toast('"이름" 버튼으로 짧은 이름을 정해두면 찾기 쉬워요');
});

$('modeBtn').addEventListener('click', () => {
  mode = mode === 'page' ? 'app' : 'page';
  try { localStorage.setItem(MODE_KEY, JSON.stringify(mode)); } catch {}
  if (mode === 'app' && playerReady) player.pauseVideo();
  render();
  toast(mode === 'app'
    ? '버튼을 누르면 유튜브 뮤직 앱에서 재생돼요. 반복은 앱에서 설정하세요'
    : '이 화면에서 바로 재생해요');
});

function addSong(id, title) {
  if (songs.some((s) => s.id === id)) { toast('이미 있는 노래예요'); return false; }
  songs.push({ id, title });
  save();
  render();
  toast('추가했어요. "이름" 버튼으로 짧게 바꿀 수 있어요');
  return true;
}

// 검색창: 유튜브 링크면 바로 추가, 아니면 검색
$('addBtn').addEventListener('click', async () => {
  const input = $('urlInput');
  const text = input.value.trim();
  if (!text) return;
  const btn = $('addBtn');
  btn.disabled = true;
  input.blur();
  try {
    const id = /^https?:\/\//.test(text) ? parseVideoId(text) : null;
    if (id) {
      const title = (await fetchTitle(id)) || prompt('제목을 못 가져왔어요. 버튼 이름을 적어주세요', '') || '노래';
      if (addSong(id, title)) input.value = '';
    } else {
      showResults(await searchVideos(text));
    }
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
});
$('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addBtn').click(); });

// ---------- 유튜브 검색 (YouTube Data API) ----------
// ohjiwoong.github.io 에서만 동작하도록 Google Cloud에서 제한된 브라우저용 키
const API_KEY = 'AIzaSyDi8_rHhoWouJZ09JEFtrRwwGqAi01uLiI';

async function searchVideos(q) {
  const params = new URLSearchParams({
    part: 'snippet', type: 'video', maxResults: '15', q,
    regionCode: 'KR', relevanceLanguage: 'ko', safeSearch: 'strict', key: API_KEY,
  });
  // 이 화면에서 재생할 땐 외부 재생이 막힌 영상은 제외
  if (mode === 'page') params.set('videoEmbeddable', 'true');
  let r;
  try { r = await fetch('https://www.googleapis.com/youtube/v3/search?' + params); }
  catch { throw new Error('인터넷 연결을 확인해주세요'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason;
    if (reason === 'quotaExceeded') throw new Error('오늘 검색 횟수를 다 썼어요. 내일 다시 해주세요');
    throw new Error('검색 실패: ' + ((j.error && j.error.message) || r.status));
  }
  return (j.items || []).map((it) => ({
    id: it.id.videoId,
    title: decodeEntities(it.snippet.title),
    channel: decodeEntities(it.snippet.channelTitle),
  }));
}

function decodeEntities(s) {
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
}

function showResults(items) {
  const box = $('results');
  box.innerHTML = '';
  if (!items.length) { toast('검색 결과가 없어요'); return; }
  items.forEach((it) => {
    const row = document.createElement('div');
    row.className = 'result';
    row.innerHTML = '<img alt=""><div class="info"><div class="t"></div><div class="c"></div></div><button></button>';
    row.querySelector('img').src = `https://i.ytimg.com/vi/${it.id}/mqdefault.jpg`;
    row.querySelector('.t').textContent = it.title;
    row.querySelector('.c').textContent = it.channel;
    const b = row.querySelector('button');
    const exists = songs.some((s) => s.id === it.id);
    b.textContent = exists ? '추가됨' : '추가';
    b.disabled = exists;
    b.addEventListener('click', () => {
      if (addSong(it.id, it.title)) { b.textContent = '추가됨'; b.disabled = true; }
    });
    // 썸네일을 누르면 미리 들어보기
    row.querySelector('img').addEventListener('click', () => play(it.id, it.title));
    box.appendChild(row);
  });
  const close = document.createElement('button');
  close.className = 'close';
  close.textContent = '검색 결과 닫기';
  close.addEventListener('click', () => { box.innerHTML = ''; });
  box.appendChild(close);
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('exportBtn').addEventListener('click', async () => {
  const text = JSON.stringify(songs);
  try { await navigator.clipboard.writeText(text); toast('목록을 복사했어요. 메모장 등에 붙여넣어 보관하세요'); }
  catch { prompt('아래 내용을 복사해 보관하세요', text); }
});
$('importBtn').addEventListener('click', () => {
  const text = prompt('내보내기로 복사한 내용을 붙여넣으세요');
  if (!text) return;
  try {
    const list = JSON.parse(text);
    if (!Array.isArray(list) || !list.every((s) => s && /^[\w-]{11}$/.test(s.id))) throw 0;
    songs = list.map((s) => ({ id: s.id, title: String(s.title || '노래') }));
    save();
    render();
    toast(`${songs.length}곡을 불러왔어요`);
  } catch { toast('형식이 올바르지 않아요'); }
});

// ---------- 화면 꺼짐 방지 ----------
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
document.addEventListener('pointerdown', requestWakeLock, { once: true });

// ---------- 전체화면 ----------
// 설치된 앱이 아니라 Chrome 탭/바로가기로 열렸을 때, 터치하면 주소창 없이 전체화면으로
const isStandalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
document.addEventListener('pointerdown', () => {
  if (isStandalone || document.fullscreenElement || !matchMedia('(pointer: coarse)').matches) return;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
});
requestWakeLock();

// ---------- 시작 ----------
$('version').textContent = '버전 ' + APP_VERSION;
render();
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
